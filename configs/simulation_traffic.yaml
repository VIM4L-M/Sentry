# The shipped simulation rules plus other road users, for training and
# evaluating a DQN that shares the streets (configs/app_traffic.yaml).
# Tick-based simulation engine and command-center rules.
# Loaded by sentry_ai.config.loader.ConfigLoader.load_simulation_config().
# Every key is optional — an omitted key uses the dataclass default in
# sentry_ai.config.schema.

# Fixed simulation steps per second, deliberately decoupled from
# render.target_fps: physics must not change speed with the frame rate.
tick_rate_hz: 10.0

mission:
  # Wall-clock budget for the whole mission, in simulated seconds.
  time_limit_seconds: 300.0
  # Re-run A* when the vehicle reports its route is obstructed.
  replan_on_blocked_route: true
  # Below this battery percentage the controller abandons the search and
  # drives straight for the hospital while it still can.
  min_battery_to_continue: 15.0
  # How many tiles of detour a dying victim is worth. Objectives are ranked
  # by planned route cost minus urgency_weight * (1 - health/100), so 0.0
  # always takes the cheapest victim to reach and large values will cross
  # the city for someone critical.
  urgency_weight: 14.0
  # Consecutive map refreshes the rest of the route must read as blocked before
  # the command center drops it and replans. A detector flickers; a collapse
  # persists. Matters when the map lags reality (Phase 7).
  block_confirm_refreshes: 3

planner:
  # Extra A* cost for a tile near a known fire. Raise to make the planner
  # detour further around heat; set to 0.0 for pure shortest-path.
  fire_risk_penalty: 6.0
  fire_risk_radius: 2
  # Small cost per direction change, so routes come out straighter and
  # produce fewer waypoints for the vehicle to chase.
  turn_penalty: 0.4

# Processes that change the city on their own, with no help from the
# vehicle. Set either `enabled: false` for a completely static city.
hazards:
  # Seeds both models. Fixed so a mission replays identically; change it to
  # sample a different disaster from the same starting map.
  seed: 20250805

  # Fire only takes hold on flammable terrain (buildings, trees, rubble) —
  # never on roads — so it threatens victims and raises the cost of nearby
  # routes without ever severing the road network.
  fire:
    enabled: true
    # Simulated seconds between automaton steps. Much slower than the tick
    # rate on purpose: a fire that mutated ten times a second would make
    # routing meaningless.
    interval_seconds: 3.0
    growth_per_step: 0.12
    burnout_per_step: 0.18
    # Per frontier tile per step, scaled by the parent fire's intensity.
    ignition_chance: 0.16
    max_radius: 3
    max_active_fires: 12

  # Trapped victims lose health while they wait, much faster beside a fire.
  # This is what makes "which victim next?" a real decision instead of a
  # lookup of the nearest one — set enabled: false and waiting costs
  # a victim nothing again.
  victims:
    enabled: true
    interval_seconds: 1.0
    # Health lost per step anywhere, and additionally at the seat of a fire
    # falling linearly to zero at fire_radius tiles away.
    base_drain: 1
    fire_drain: 10
    # Larger than a fire's drawn footprint on purpose: smoke and heat reach
    # further than the flames.
    fire_radius: 5.0

  # The dynamic obstacle: a weakened facade drops into the street beside
  # it, on a tile the planner already believed was clear. This is what
  # actually forces mid-mission replanning.
  debris:
    enabled: true
    # Tuned against the shipped 30x20 map, where a full four-victim mission
    # runs ~20 simulated seconds: often enough that a typical mission sees
    # its route cut at least once, rare enough to stay a shock.
    interval_seconds: 3.0
    collapse_chance: 0.5
    # Per-mission budget, so the city always stays navigable.
    max_collapses: 6

# Road users on the 30x20 map: enough that the vehicle meets them on most
# routes, few enough that streets stay passable.
traffic:
  enabled: true
  cars: 10
  pedestrians: 14
  car_step_ticks: 2
  pedestrian_step_ticks: 4
  crossing_chance: 0.15
  seed: 20250928
